<div class="cookie-modal" id="cookieModal">
  <div class="cookie-content">
    <h3>
      <span class="cookie-icon">🛡️</span> Privacy Preferences
    </h3>
    <p>
      We use cookies to optimize system navigation, analyze site traffic, and enhance performance. 
      You can manage your choices below or accept our default settings.
    </p>

    <!-- Collapsible Cookie Preferences Drawer -->
    <details class="cookie-drawer">
      <summary class="cookie-drawer-trigger">
        <span>Customize Cookie Preferences</span>
        <span class="chevron">▼</span>
      </summary>

      <div class="cookie-options">
        <!-- Necessary Cookies (Always Active) -->
        <label class="cookie-option">
          <input type="checkbox" checked disabled />
          <div class="option-text">
            <strong>Strictly Necessary</strong>
            <p>Required for basic security, routing, and system functionality. Cannot be disabled.</p>
          </div>
        </label>

        <!-- Analytics Cookies (Default Unchecked for GDPR Compliance) -->
        <label class="cookie-option">
          <input type="checkbox" id="cookie-analytics" />
          <div class="option-text">
            <strong>Analytics & Performance</strong>
            <p>Helps us analyze site traffic and improve performance metrics via anonymized data.</p>
          </div>
        </label>

        <!-- Functionality / Preferences -->
        <label class="cookie-option">
          <input type="checkbox" id="cookie-functional" />
          <div class="option-text">
            <strong>Preferences & Customization</strong>
            <p>Saves your settings, preferred dark mode settings, and user interface options.</p>
          </div>
        </label>
      </div>
    </details>

    <!-- Action Buttons -->
    <div class="cookie-actions">
      <button type="button" class="btn btn-secondary" id="btn-reject-cookies">
        Essential Only
      </button>
      <button type="button" class="btn btn-secondary hidden" id="btn-save-cookies">
        Save Selection
      </button>
      <button type="button" class="btn btn-primary" id="btn-accept-all">
        Accept All
      </button>
    </div>
  </div>
</div>
